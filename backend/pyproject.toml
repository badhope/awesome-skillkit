[tool.poetry]
name = "ai-skill"
version = "1.0.0"
description = "The largest universal AI agent skill library — 9,400+ production-ready skills"
authors = ["badhope <badhope@users.noreply.github.com>"]
repository = "https://github.com/badhope/AI-SKILL"
homepage = "https://github.com/badhope/AI-SKILL"
keywords = ["ai", "skill", "agent", "library", "llm", "ml", "fastapi", "vector", "embeddings"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.30.0"
qdrant-client = "^1.11.2"
redis = { extras = ["hiredis"], version = "^7.4.0" }
celery = "^5.4.0"
pydantic = { version = "^2.9.2", extras = ["email"] }
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.12"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
httpx = "^0.27.2"
structlog = "^24.4.0"
sentry-sdk = "^2.17.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
typer = "^0.13.0"
rich = "^13.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.8.0"
ruff = "^0.7.1"
mypy = "^1.12.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
