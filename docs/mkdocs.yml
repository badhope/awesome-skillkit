site_name: AI-SKILL
site_description: An open-source universal agent skill library
site_author: AI-SKILL Contributors
site_url: https://badhope.github.io/AI-SKILL/
copyright: Copyright © 2026 AI-SKILL Contributors · MIT License

repo_name: badhope/AI-SKILL
repo_url: https://github.com/badhope/AI-SKILL
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ../site

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/badhope/AI-SKILL
      name: AI-SKILL on GitHub
    - icon: fontawesome/solid/globe
      link: https://github.com/badhope/AI-SKILL
      name: Source repository
  generator: false
  alternate:
    - name: English
      link: /
      lang: en

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/star-four-points
  favicon: assets/favicon.svg
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.prune
    - navigation.footer
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # TOC
    - toc.follow
    - toc.collapse
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    # Footer
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search:
      lang: en
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Permanent link to this section
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.magiclink:
      repo_url_shorthand: true
      social_url_shorthand: true
      normalize_issue_symbols: true

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Quick start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Architecture:
    - Overview: architecture.md
    - Data model: assets/data-model.md
    - Search pipeline: search.md
    - ADRs:
      - Overview: adr/README.md
      - "001 — Pydantic v2 + ClassVar Depends": adr/001-pydantic-v2-and-classvar-depends.md
      - "002 — Qdrant for vector search": adr/002-qdrant-vector-search.md
      - "003 — JWT (HS256) over RS256": adr/003-jwt-hs256.md
      - "004 — JSONB for skills.content and compositions.items": adr/004-jsonb-flexible-content.md
      - "005 — Poetry for backend, npm for frontend": adr/005-polyglob-packaging.md
      - "006 — Next.js 15 App Router": adr/006-nextjs-app-router.md
      - "007 — Single-tenant v1, multi-tenant v1.2": adr/007-tenancy-model.md
      - "008 — Failure-fast secret validation": adr/008-fail-fast-secrets.md
      - "009 — OWASP security headers middleware": adr/009-owasp-headers.md
      - "010 — Pre-commit hooks + conventional commits": adr/010-pre-commit-and-commits.md
  - Operations:
    - Deployment: deployment.md
    - Troubleshooting: troubleshooting.md
    - Security: operations/security.md
    - Backup & restore: operations/backup.md
    - Observability: operations/observability.md
  - Development:
    - Setup: development.md
    - Adding an API endpoint: development/adding-endpoint.md
    - Adding a frontend page: development/adding-page.md
    - Database migrations: development/migrations.md
    - Testing: development/testing.md
    - Release process: development/release.md
  - Reference:
    - Configuration reference: reference/configuration.md
    - CLI: reference/cli.md
    - Environment variables: reference/environment.md
    - HTTP status codes: reference/http-status-codes.md
  - SDKs:
    - Overview: sdks/README.md
    - Python: sdks/python.md
    - TypeScript: sdks/typescript.md
  - Examples:
    - Overview: examples/index.md
    - REST (curl + .http): examples/rest.md
    - Python: examples/python.md
    - TypeScript: examples/typescript.md
    - Postman: examples/postman.md
  - Community:
    - Contributing: community/contributing.md
    - Code of conduct: community/code-of-conduct.md
    - FAQ: community/faq.md
    - Roadmap: community/roadmap.md
    - Changelog: community/changelog.md
    - Troubleshooting (short): community/troubleshooting-short.md

validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: ignore
