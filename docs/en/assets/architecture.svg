<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img"
     aria-label="AI-SKILL layered architecture">
  <title>AI-SKILL architecture overview</title>
  <desc>Five layers: Client, Edge, Application, Stateful services, Operations.</desc>

  <defs>
    <style>
      .layer       { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; rx: 10; ry: 10; }
      .layer-title { font: 600 14px system-ui, sans-serif; fill: #57606a; }
      .box        { fill: #ffffff; stroke: #57606a; stroke-width: 1; rx: 6; ry: 6; }
      .box-text   { font: 500 12px system-ui, sans-serif; fill: #24292f; text-anchor: middle; }
      .arrow      { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#57606a" />
    </marker>
  </defs>

  <!-- L1 Client -->
  <rect class="layer" x="20" y="20"  width="880" height="100"/>
  <text class="layer-title" x="30" y="40">L1 · Client</text>
  <rect class="box" x="60"  y="55" width="170" height="50"/>
  <text class="box-text" x="145" y="85">Browser PWA</text>
  <rect class="box" x="260" y="55" width="170" height="50"/>
  <text class="box-text" x="345" y="85">Mobile browser</text>
  <rect class="box" x="460" y="55" width="170" height="50"/>
  <text class="box-text" x="545" y="85">Python SDK</text>
  <rect class="box" x="660" y="55" width="170" height="50"/>
  <text class="box-text" x="745" y="85">TypeScript SDK</text>

  <!-- L2 Edge -->
  <rect class="layer" x="20" y="140" width="880" height="80"/>
  <text class="layer-title" x="30" y="160">L2 · Edge</text>
  <rect class="box" x="320" y="170" width="280" height="36"/>
  <text class="box-text" x="460" y="193">Nginx / Caddy / Traefik  (TLS, gzip, rate-limit)</text>

  <!-- L3 Application -->
  <rect class="layer" x="20" y="240" width="880" height="100"/>
  <text class="layer-title" x="30" y="260">L3 · Application</text>
  <rect class="box" x="60"  y="275" width="350" height="50"/>
  <text class="box-text" x="235" y="305">Frontend · Next.js 15  (SSR + RSC)</text>
  <rect class="box" x="510" y="275" width="350" height="50"/>
  <text class="box-text" x="685" y="305">Backend · FastAPI 0.115  (async, OpenAPI)</text>

  <!-- L4 Stateful services -->
  <rect class="layer" x="20" y="360" width="880" height="120"/>
  <text class="layer-title" x="30" y="380">L4 · Stateful services</text>
  <rect class="box" x="60"  y="395" width="180" height="70"/>
  <text class="box-text" x="150" y="425">PostgreSQL 16</text>
  <text class="box-text" x="150" y="445">asyncpg</text>
  <rect class="box" x="270" y="395" width="180" height="70"/>
  <text class="box-text" x="360" y="425">Redis 7</text>
  <text class="box-text" x="360" y="445">cache · denylist</text>
  <rect class="box" x="480" y="395" width="180" height="70"/>
  <text class="box-text" x="570" y="425">Qdrant 1.9+</text>
  <text class="box-text" x="570" y="445">vector search</text>
  <rect class="box" x="690" y="395" width="180" height="70"/>
  <text class="box-text" x="780" y="425">Object storage</text>
  <text class="box-text" x="780" y="445">S3 / R2 / local</text>

  <!-- L5 Operations -->
  <rect class="layer" x="20" y="500" width="880" height="80"/>
  <text class="layer-title" x="30" y="520">L5 · Operations</text>
  <rect class="box" x="60"  y="530" width="170" height="36"/>
  <text class="box-text" x="145" y="553">Docker Compose</text>
  <rect class="box" x="260" y="530" width="170" height="36"/>
  <text class="box-text" x="345" y="553">GitHub Actions</text>
  <rect class="box" x="460" y="530" width="170" height="36"/>
  <text class="box-text" x="545" y="553">Sentry</text>
  <rect class="box" x="660" y="530" width="170" height="36"/>
  <text class="box-text" x="745" y="553">OpenTelemetry</text>

  <!-- Edges (subtle) -->
  <line class="arrow" x1="460" y1="120" x2="460" y2="140"/>
  <line class="arrow" x1="460" y1="220" x2="460" y2="240"/>
  <line class="arrow" x1="460" y1="340" x2="460" y2="360"/>
  <line class="arrow" x1="460" y1="480" x2="460" y2="500"/>
</svg>
