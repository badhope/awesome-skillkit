<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"
     aria-label="AI-SKILL data model ER diagram">
  <title>AI-SKILL data model</title>

  <defs>
    <style>
      .entity      { fill: #ffffff; stroke: #24292f; stroke-width: 1.5; rx: 6; ry: 6; }
      .entity-name { font: 700 13px system-ui, sans-serif; fill: #24292f; }
      .col         { font: 500 11px ui-monospace, "SF Mono", monospace; fill: #24292f; }
      .col-type    { font: 400 11px ui-monospace, "SF Mono", monospace; fill: #57606a; }
      .pk          { fill: #ddf4ff; }
      .fk          { fill: #fff8c5; }
      .rel         { stroke: #57606a; stroke-width: 1.2; fill: none; }
      .rel-text    { font: 500 10px system-ui, sans-serif; fill: #57606a; text-anchor: middle; }
    </style>
  </defs>

  <!-- users -->
  <g>
    <rect class="entity" x="20" y="30" width="220" height="140"/>
    <text class="entity-name" x="130" y="52" text-anchor="middle">users</text>
    <rect class="pk" x="20" y="60" width="220" height="20"/>
    <text class="col" x="30" y="74">id</text>
    <text class="col-type" x="240" y="74" text-anchor="end">uuid</text>
    <text class="col" x="30" y="94">email</text>
    <text class="col-type" x="240" y="94" text-anchor="end">varchar (UQ)</text>
    <text class="col" x="30" y="114">username</text>
    <text class="col-type" x="240" y="114" text-anchor="end">varchar (UQ)</text>
    <text class="col" x="30" y="134">hashed_password</text>
    <text class="col-type" x="240" y="134" text-anchor="end">varchar</text>
    <text class="col" x="30" y="154">is_superuser</text>
    <text class="col-type" x="240" y="154" text-anchor="end">bool</text>
  </g>

  <!-- skills -->
  <g>
    <rect class="entity" x="320" y="30" width="240" height="220"/>
    <text class="entity-name" x="440" y="52" text-anchor="middle">skills</text>
    <rect class="pk" x="320" y="60" width="240" height="20"/>
    <text class="col" x="330" y="74">id</text>
    <text class="col-type" x="560" y="74" text-anchor="end">uuid</text>
    <text class="col" x="330" y="94">slug</text>
    <text class="col-type" x="560" y="94" text-anchor="end">varchar (UQ)</text>
    <rect class="fk" x="320" y="100" width="240" height="20"/>
    <text class="col" x="330" y="114">category_id → categories.id</text>
    <text class="col-type" x="560" y="114" text-anchor="end">uuid</text>
    <rect class="fk" x="320" y="120" width="240" height="20"/>
    <text class="col" x="330" y="134">author_id → users.id</text>
    <text class="col-type" x="560" y="134" text-anchor="end">uuid</text>
    <text class="col" x="330" y="154">name · description</text>
    <text class="col-type" x="560" y="154" text-anchor="end">text</text>
    <text class="col" x="330" y="174">content</text>
    <text class="col-type" x="560" y="174" text-anchor="end">jsonb</text>
    <text class="col" x="330" y="194">is_public · is_featured</text>
    <text class="col-type" x="560" y="194" text-anchor="end">bool</text>
    <text class="col" x="330" y="214">rating_avg · rating_count</text>
    <text class="col-type" x="560" y="214" text-anchor="end">numeric · int</text>
    <text class="col" x="330" y="234">download_count · view_count</text>
    <text class="col-type" x="560" y="234" text-anchor="end">int</text>
  </g>

  <!-- skill_versions -->
  <g>
    <rect class="entity" x="640" y="30" width="240" height="140"/>
    <text class="entity-name" x="760" y="52" text-anchor="middle">skill_versions</text>
    <rect class="pk" x="640" y="60" width="240" height="20"/>
    <text class="col" x="650" y="74">(skill_id, version)</text>
    <text class="col-type" x="880" y="74" text-anchor="end">uuid · varchar</text>
    <text class="col" x="650" y="94">changelog</text>
    <text class="col-type" x="880" y="94" text-anchor="end">text</text>
    <text class="col" x="650" y="114">content</text>
    <text class="col-type" x="880" y="114" text-anchor="end">jsonb</text>
    <text class="col" x="650" y="134">created_at</text>
    <text class="col-type" x="880" y="134" text-anchor="end">timestamptz</text>
    <text class="col" x="650" y="154">created_by → users.id</text>
    <text class="col-type" x="880" y="154" text-anchor="end">uuid</text>
  </g>

  <!-- categories -->
  <g>
    <rect class="entity" x="20" y="320" width="220" height="120"/>
    <text class="entity-name" x="130" y="342" text-anchor="middle">categories</text>
    <rect class="pk" x="20" y="350" width="220" height="20"/>
    <text class="col" x="30" y="364">id</text>
    <text class="col-type" x="240" y="364" text-anchor="end">uuid</text>
    <text class="col" x="30" y="384">slug</text>
    <text class="col-type" x="240" y="384" text-anchor="end">varchar (UQ)</text>
    <text class="col" x="30" y="404">parent_id → categories.id</text>
    <text class="col-type" x="240" y="404" text-anchor="end">uuid (nullable)</text>
    <text class="col" x="30" y="424">sort_order</text>
    <text class="col-type" x="240" y="424" text-anchor="end">int</text>
  </g>

  <!-- tags / skill_tags -->
  <g>
    <rect class="entity" x="320" y="320" width="220" height="100"/>
    <text class="entity-name" x="430" y="342" text-anchor="middle">tags</text>
    <rect class="pk" x="320" y="350" width="220" height="20"/>
    <text class="col" x="330" y="364">id</text>
    <text class="col-type" x="540" y="364" text-anchor="end">uuid</text>
    <text class="col" x="330" y="384">name · color</text>
    <text class="col-type" x="540" y="384" text-anchor="end">varchar</text>
    <text class="col" x="330" y="404">description</text>
    <text class="col-type" x="540" y="404" text-anchor="end">text</text>

    <rect class="entity" x="320" y="450" width="220" height="60"/>
    <text class="entity-name" x="430" y="470" text-anchor="middle">skill_tags (join)</text>
    <text class="col" x="330" y="490">(skill_id, tag_id)</text>
    <text class="col-type" x="540" y="490" text-anchor="end">uuid · uuid</text>
  </g>

  <!-- compositions -->
  <g>
    <rect class="entity" x="640" y="320" width="240" height="120"/>
    <text class="entity-name" x="760" y="342" text-anchor="middle">compositions</text>
    <rect class="pk" x="640" y="350" width="240" height="20"/>
    <text class="col" x="650" y="364">id</text>
    <text class="col-type" x="880" y="364" text-anchor="end">uuid</text>
    <text class="col" x="650" y="384">slug</text>
    <text class="col-type" x="880" y="384" text-anchor="end">varchar (UQ)</text>
    <text class="col" x="650" y="404">items</text>
    <text class="col-type" x="880" y="404" text-anchor="end">jsonb</text>
    <text class="col" x="650" y="424">is_public · owner_id</text>
    <text class="col-type" x="880" y="424" text-anchor="end">bool · uuid</text>
  </g>

  <!-- Edges -->
  <line class="rel" x1="240" y1="100" x2="320" y2="100"/>
  <line class="rel" x1="240" y1="120" x2="320" y2="140"/>
  <line class="rel" x1="560" y1="120" x2="640" y2="100"/>
  <line class="rel" x1="240" y1="380" x2="320" y2="380"/>
  <line class="rel" x1="540" y1="380" x2="640" y2="380"/>
  <line class="rel" x1="560" y1="180" x2="430" y2="320"/>
</svg>
