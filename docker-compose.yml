version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skill_user
      POSTGRES_PASSWORD: skill_pass
      POSTGRES_DB: skill_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_user -d skill_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skill-network

  redis:
    image: redis:7-alpine
    container_name: skill-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skill-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: skill-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - skill-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://skill_user:skill_pass@postgres:5432/skill_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      BACKEND_CORS_ORIGINS: http://localhost:3000
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      STORAGE_TYPE: local
      EMBEDDING_MODEL: sentence-transformers/all-mpnet-base-v2
      EMBEDDING_DIMENSION: 768
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skill-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skill-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_NAME: "AI-SKILL"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skill-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  skill-network:
    driver: bridge