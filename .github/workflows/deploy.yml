name: Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/skill-system

            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" > .env
            echo "REDIS_URL=${{ secrets.STAGING_REDIS_URL }}" >> .env
            echo "QDRANT_URL=${{ secrets.STAGING_QDRANT_URL }}" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}" >> .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend python scripts/health_check.py

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "Deploying tag ${{ github.ref_name }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/skill-system

            echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" > .env
            echo "REDIS_URL=${{ secrets.PROD_REDIS_URL }}" >> .env
            echo "QDRANT_URL=${{ secrets.PROD_QDRANT_URL }}" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET }}" >> .env
            echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}" >> .env

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose exec -T backend python scripts/health_check.py

      - name: Notify deployment
        run: |
          echo "Deployment to production completed at $(date -u)"
          echo "Version: ${{ github.ref_name }}"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-staging, deploy-production]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Rollback deployment
        run: |
          echo "Rollback triggered for environment: ${{ github.event.inputs.environment }}"
          echo "Please manually rollback to the previous version."