[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "skill-sdk"
version = "1.0.0"
description = "Python SDK for the AI-SKILL platform"
authors = ["AI-SKILL <noreply@badhope.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/badhope/AI-SKILL"
homepage = "https://github.com/badhope/AI-SKILL"
keywords = ["ai", "skill", "llm", "agent", "api-client"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = ">=0.24,<1.5"
ruff = "^0.7.0"
mypy = "^1.12.0"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]