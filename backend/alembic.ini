[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only — the real URL is injected at runtime from the
# DATABASE_URL environment variable (see alembic/env.py). The values below
# are deliberately obvious placeholders and are NEVER used in practice.
sqlalchemy.url = postgresql+asyncpg://REPLACE_ME:REPLACE_ME@localhost:5432/skill_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S